<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 스탑워치</title>
<style>
  :root {
    --bg: #e4e4e7;
    --text: #18181b;
    --muted: #52525b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --text: #fafafa;
      --muted: #a1a1aa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .scene {
    width: 100%;
    max-width: 1000px;
    border-radius: 20px;
    background: radial-gradient(ellipse at 50% 40%, #2a2a30 0%, #0c0c0f 70%);
  }
  svg { display: block; width: 100%; height: auto; user-select: none; -webkit-tap-highlight-color: transparent; }
  .lcd { font-family: "Consolas", "SF Mono", ui-monospace, monospace; }

  .btn { cursor: pointer; }
  .btn .cap { transform-box: fill-box; transform-origin: center; transition: transform .08s; }
  .btn:active .cap, .btn.pressed .cap { transform: scale(.9); }
  .btn .ring { opacity: .55; transition: opacity .15s; }
  .btn:hover .ring { opacity: 1; }
  .btn.off { cursor: default; opacity: .35; }
  .btn.off .ring { opacity: 0; }
  .btn.off:active .cap { transform: none; }

  #knobPointer { transition: transform .2s; transform-origin: 500px 440px; }

  .legend {
    max-width: 1000px;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 22px;
    margin-top: 14px;
    font-size: .85rem;
    color: var(--muted);
  }
  .legend b { color: var(--text); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 카본 파이버 -->
    <pattern id="carbon" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#141416"/>
      <rect width="5" height="5" fill="#1f1f23"/>
      <rect x="5" y="5" width="5" height="5" fill="#1f1f23"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0d0f"/>
      <stop offset=".5" stop-color="#26262b"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="paddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>
    <radialGradient id="capShine" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity=".25"/>
    </radialGradient>
    <radialGradient id="knobGrad" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#5b5b63"/>
      <stop offset="1" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="lcdGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".7"/>
    </filter>
    <clipPath id="lcdClip"><rect x="360" y="192" width="280" height="168" rx="6"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- 시프트 패들 -->
    <path d="M 255 150 L 200 92 Q 192 80 208 78 L 340 96 Q 352 98 350 112 L 345 150 Z" fill="url(#paddle)"/>
    <path d="M 745 150 L 800 92 Q 808 80 792 78 L 660 96 Q 648 98 650 112 L 655 150 Z" fill="url(#paddle)"/>

    <!-- 그립 -->
    <rect x="92" y="150" width="175" height="380" rx="78" fill="url(#grip)"/>
    <rect x="733" y="150" width="175" height="380" rx="78" fill="url(#grip)"/>
    <g stroke="#000" stroke-opacity=".55" stroke-width="3">
      <line x1="108" y1="250" x2="108" y2="430"/><line x1="120" y1="235" x2="120" y2="450"/>
      <line x1="132" y1="225" x2="132" y2="460"/><line x1="144" y1="220" x2="144" y2="465"/>
      <line x1="892" y1="250" x2="892" y2="430"/><line x1="880" y1="235" x2="880" y2="450"/>
      <line x1="868" y1="225" x2="868" y2="460"/><line x1="856" y1="220" x2="856" y2="465"/>
    </g>

    <!-- 본체 (카본) -->
    <path id="body" d="M 250 128 L 750 128 Q 792 128 792 170 L 792 420 Q 792 468 744 488 L 600 540 Q 500 572 400 540 L 256 488 Q 208 468 208 420 L 208 170 Q 208 128 250 128 Z" fill="url(#carbon)"/>
    <use href="#body" fill="url(#sheen)"/>
    <use href="#body" fill="none" stroke="#3f3f46" stroke-width="2"/>
    <path d="M 214 300 Q 214 470 400 534" fill="none" stroke="#e10600" stroke-width="3" stroke-opacity=".8"/>
    <path d="M 786 300 Q 786 470 600 534" fill="none" stroke="#e10600" stroke-width="3" stroke-opacity=".8"/>
  </g>

  <!-- 나사 -->
  <g fill="#71717a" stroke="#27272a" stroke-width="1.5">
    <circle cx="232" cy="150" r="5"/><circle cx="768" cy="150" r="5"/>
    <circle cx="232" cy="450" r="5"/><circle cx="768" cy="450" r="5"/>
    <circle cx="500" cy="545" r="5"/>
  </g>

  <!-- 시프트 라이트: 0.1초 -->
  <rect x="300" y="140" width="400" height="36" rx="10" fill="#050507" stroke="#2f2f35"/>
  <g id="shiftLeds"></g>

  <!-- 플래그 라이트 -->
  <g id="flagLeds"></g>

  <!-- LCD -->
  <rect x="352" y="184" width="296" height="184" rx="12" fill="#0a0a0c" stroke="#3a3a40" stroke-width="2"/>
  <rect x="360" y="192" width="280" height="168" rx="6" fill="#03070b"/>
  <g clip-path="url(#lcdClip)" class="lcd">
    <!-- RACE 페이지 -->
    <g id="pageRace">
      <g id="secBar"></g>
      <text x="368" y="236" fill="#9ca3af" font-size="11" font-weight="700">LAP <tspan id="lapNo" fill="#fff" font-size="15">1</tspan></text>
      <text id="status" x="500" y="236" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">READY</text>
      <text id="delta" x="632" y="236" fill="#9ca3af" font-size="13" font-weight="700" text-anchor="end">Δ --.--</text>
      <text id="mainTime" x="500" y="296" fill="#fff" font-size="52" font-weight="700" text-anchor="middle">00:00<tspan id="mainCs" font-size="30" fill="#9ca3af">.00</tspan></text>
      <g font-size="9" font-weight="700" fill="#9ca3af">
        <rect x="366" y="314" width="86" height="40" rx="4" fill="#0e1720"/>
        <rect x="457" y="314" width="86" height="40" rx="4" fill="#0e1720"/>
        <rect x="548" y="314" width="86" height="40" rx="4" fill="#1a0f24"/>
        <text x="372" y="326">CURRENT</text>
        <text x="463" y="326">LAST</text>
        <text x="554" y="326" fill="#c084fc">BEST</text>
      </g>
      <g font-size="15" font-weight="700" fill="#fff" text-anchor="end">
        <text id="curLap" x="446" y="347">00:00.00</text>
        <text id="lastLap" x="537" y="347">--:--.--</text>
        <text id="bestLap" x="628" y="347" fill="#d8b4fe">--:--.--</text>
      </g>
    </g>
    <!-- LAPS 페이지 -->
    <g id="pageLaps" style="display:none">
      <rect x="360" y="192" width="280" height="22" fill="#e10600"/>
      <text x="500" y="208" fill="#fff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="3">LAP HISTORY</text>
      <g id="lapRows" font-size="14" font-weight="700"></g>
      <text id="lapEmpty" x="500" y="290" fill="#6b7280" font-size="12" text-anchor="middle">NO LAPS</text>
    </g>
  </g>
  <rect x="360" y="192" width="280" height="168" rx="6" fill="url(#lcdGlass)" pointer-events="none"/>

  <!-- 장식 버튼 -->
  <g font-size="9" font-weight="800" text-anchor="middle" fill="#d4d4d8">
    <g transform="translate(262 392)"><circle r="15" fill="#27272a" stroke="#000"/><circle r="15" fill="url(#capShine)"/><text y="3">PL</text></g>
    <g transform="translate(300 432)"><circle r="15" fill="#27272a" stroke="#000"/><circle r="15" fill="url(#capShine)"/><text y="3">RADIO</text></g>
    <g transform="translate(738 392)"><circle r="15" fill="#27272a" stroke="#000"/><circle r="15" fill="url(#capShine)"/><text y="3">DRS</text></g>
    <g transform="translate(700 432)"><circle r="15" fill="#27272a" stroke="#000"/><circle r="15" fill="url(#capShine)"/><text y="3">BOX</text></g>
  </g>

  <!-- 장식 로터리 -->
  <g id="rotaries"></g>

  <!-- PAGE 로터리 (RACE / LAPS 화면 전환) -->
  <g id="knobPage" class="btn">
    <circle cx="500" cy="440" r="40" fill="#facc15" class="ring" filter="url(#glow)" opacity=".25"/>
    <circle cx="500" cy="440" r="34" fill="#0a0a0c"/>
    <g class="cap">
      <circle cx="500" cy="440" r="27" fill="url(#knobGrad)" stroke="#000"/>
      <g id="knobPointer"><rect x="497" y="416" width="6" height="16" rx="3" fill="#facc15"/></g>
    </g>
    <text x="458" y="408" fill="#d4d4d8" font-size="9" font-weight="800" text-anchor="middle" id="lblRace">RACE</text>
    <text x="542" y="408" fill="#71717a" font-size="9" font-weight="800" text-anchor="middle" id="lblLaps">LAPS</text>
    <text x="500" y="494" fill="#facc15" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="2">PAGE</text>
  </g>

  <!-- 기능 버튼 -->
  <g id="btnStart" class="btn">
    <circle cx="288" cy="228" r="38" fill="#22c55e" class="ring" filter="url(#glow)" id="startRing"/>
    <circle cx="288" cy="228" r="34" fill="#0a0a0c"/>
    <g class="cap">
      <circle cx="288" cy="228" r="29" fill="#16a34a" id="startCap"/>
      <circle cx="288" cy="228" r="29" fill="url(#capShine)"/>
    </g>
    <text x="288" y="233" fill="#fff" font-size="13" font-weight="900" text-anchor="middle" id="startLabel" pointer-events="none">START</text>
  </g>

  <g id="btnReset" class="btn off">
    <circle cx="288" cy="316" r="27" fill="#f97316" class="ring" filter="url(#glow)"/>
    <circle cx="288" cy="316" r="24" fill="#0a0a0c"/>
    <g class="cap">
      <circle cx="288" cy="316" r="20" fill="#ea580c"/>
      <circle cx="288" cy="316" r="20" fill="url(#capShine)"/>
    </g>
    <text x="288" y="320" fill="#fff" font-size="10" font-weight="900" text-anchor="middle" pointer-events="none">RESET</text>
  </g>

  <g id="btnLap" class="btn off">
    <circle cx="712" cy="228" r="38" fill="#3b82f6" class="ring" filter="url(#glow)"/>
    <circle cx="712" cy="228" r="34" fill="#0a0a0c"/>
    <g class="cap">
      <circle cx="712" cy="228" r="29" fill="#2563eb"/>
      <circle cx="712" cy="228" r="29" fill="url(#capShine)"/>
    </g>
    <text x="712" y="233" fill="#fff" font-size="14" font-weight="900" text-anchor="middle" pointer-events="none">LAP</text>
  </g>

  <!-- 장식 소형 버튼 -->
  <g font-size="8" font-weight="800" text-anchor="middle" fill="#a1a1aa">
    <g transform="translate(712 316)"><rect x="-20" y="-12" width="40" height="24" rx="6" fill="#27272a" stroke="#000"/><rect x="-20" y="-12" width="40" height="24" rx="6" fill="url(#capShine)"/><text y="3">OT</text></g>
  </g>
</svg>
</div>

<div class="legend">
  <span><span class="dot" style="background:#22c55e"></span><b>START / STOP</b> 출발·정지 (Space)</span>
  <span><span class="dot" style="background:#3b82f6"></span><b>LAP</b> 랩 기록 (L)</span>
  <span><span class="dot" style="background:#f97316"></span><b>RESET</b> 정지 상태에서 초기화 (R)</span>
  <span><span class="dot" style="background:#facc15"></span><b>PAGE</b> 주행 / 랩 기록 화면 전환 (P)</span>
  <span>상단 시프트 라이트는 1초마다 차오름 · 화면 위 막대는 60초 진행</span>
</div>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  // 시프트 라이트 15개: 초록 5 / 빨강 5 / 파랑 5
  const SHIFT_COLORS = [...Array(5).fill('#22c55e'), ...Array(5).fill('#ef4444'), ...Array(5).fill('#3b82f6')];
  const shiftLeds = SHIFT_COLORS.map((_, i) =>
    el('circle', { cx: 322 + i * 25.4, cy: 158, r: 8.5, fill: '#1a1a1d', stroke: '#000' }, $('shiftLeds')));

  // 플래그 라이트: LCD 양옆
  const flagLeds = [];
  [[336, 206], [336, 236], [664, 206], [664, 236]].forEach(([cx, cy]) =>
    flagLeds.push(el('circle', { cx, cy, r: 7, fill: '#1a1a1d', stroke: '#000' }, $('flagLeds'))));

  // LCD 상단 초 막대: 30칸 = 60초
  const secSegs = [];
  for (let i = 0; i < 30; i++) {
    const color = i < 18 ? '#22c55e' : i < 25 ? '#facc15' : '#ef4444';
    secSegs.push({ rect: el('rect', { x: 368 + i * 8.8, y: 200, width: 7, height: 14, rx: 1, fill: '#111827' }, $('secBar')), color });
  }

  // 장식 로터리
  [[390, 440, '#ef4444', 'ENG'], [610, 440, '#3b82f6', 'BBAL']].forEach(([x, y, c, label]) => {
    const g = el('g', {}, $('rotaries'));
    for (let i = 0; i < 12; i++) {
      const a = (i * 30 - 90) * Math.PI / 180;
      el('line', { x1: x + Math.cos(a) * 30, y1: y + Math.sin(a) * 30, x2: x + Math.cos(a) * 35, y2: y + Math.sin(a) * 35, stroke: '#71717a', 'stroke-width': 2 }, g);
    }
    el('circle', { cx: x, cy: y, r: 25, fill: 'url(#knobGrad)', stroke: '#000' }, g);
    el('circle', { cx: x, cy: y, r: 25, fill: 'none', stroke: c, 'stroke-width': 3 }, g);
    el('rect', { x: x - 2.5, y: y - 22, width: 5, height: 12, rx: 2.5, fill: c, transform: `rotate(${label === 'ENG' ? -60 : 30} ${x} ${y})` }, g);
    const t = el('text', { x, y: y + 50, fill: '#a1a1aa', 'font-size': 9, 'font-weight': 800, 'text-anchor': 'middle' }, g);
    t.textContent = label;
  });

  const btnStart = $('btnStart'), btnLap = $('btnLap'), btnReset = $('btnReset');

  let running = false;
  let startTime = 0;
  let elapsed = 0;
  let laps = [];          // { time, total }
  let page = 'race';
  let rafId = null;
  let flashUntil = 0, flashColor = null;

  const pad = n => String(n).padStart(2, '0');
  function parts(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    return { main: (h ? h + ':' : '') + pad(m) + ':' + pad(s), cs: '.' + pad(cs) };
  }
  const format = ms => { const p = parts(ms); return p.main + p.cs; };

  const currentTotal = () => running ? elapsed + (performance.now() - startTime) : elapsed;
  const lastLapTotal = () => laps.length ? laps[laps.length - 1].total : 0;
  const bestLap = () => laps.length ? Math.min(...laps.map(l => l.time)) : null;

  function render() {
    const total = currentTotal();
    const now = performance.now();

    // 시프트 라이트: 1초 동안 15개가 차오름, 정지 중에는 꺼짐
    const lit = total > 0 && running ? Math.floor((total % 1000) / 1000 * 15) + 1 : 0;
    shiftLeds.forEach((c, i) => {
      const on = i < lit;
      c.setAttribute('fill', on ? SHIFT_COLORS[i] : '#1a1a1d');
      c.setAttribute('filter', on ? 'url(#glow)' : '');
    });

    // 플래그 라이트: 랩 기록 순간 깜빡임
    const flashing = now < flashUntil && Math.floor(now / 120) % 2 === 0;
    flagLeds.forEach(c => {
      c.setAttribute('fill', flashing ? flashColor : '#1a1a1d');
      c.setAttribute('filter', flashing ? 'url(#glow)' : '');
    });

    // 60초 진행 막대
    const segs = total > 0 ? Math.floor((total % 60000) / 2000) + 1 : 0;
    secSegs.forEach((s, i) => s.rect.setAttribute('fill', i < segs ? s.color : '#111827'));

    const p = parts(total);
    $('mainTime').firstChild.textContent = p.main;
    $('mainTime').setAttribute('font-size', p.main.length > 5 ? 42 : 52);
    $('mainCs').textContent = p.cs;
    $('curLap').textContent = format(total - lastLapTotal());
    $('lapNo').textContent = laps.length + 1;
    $('status').textContent = running ? 'RUN' : total > 0 ? 'PAUSE' : 'READY';
    $('status').setAttribute('fill', running ? '#22c55e' : total > 0 ? '#ef4444' : '#facc15');
  }

  function renderLaps() {
    const best = bestLap();
    const last = laps[laps.length - 1];
    $('lastLap').textContent = last ? format(last.time) : '--:--.--';
    $('bestLap').textContent = best !== null ? format(best) : '--:--.--';

    // 직전 랩과 그 이전 최고 랩의 차이
    const delta = $('delta');
    if (laps.length >= 2) {
      const prevBest = Math.min(...laps.slice(0, -1).map(l => l.time));
      const d = (last.time - prevBest) / 1000;
      delta.textContent = 'Δ ' + (d > 0 ? '+' : '') + d.toFixed(2);
      delta.setAttribute('fill', d < 0 ? '#c084fc' : '#f87171');
    } else {
      delta.textContent = 'Δ --.--';
      delta.setAttribute('fill', '#9ca3af');
    }

    const rows = $('lapRows');
    rows.innerHTML = '';
    $('lapEmpty').style.display = laps.length ? 'none' : '';
    laps.slice(-6).reverse().forEach((lap, i) => {
      const n = laps.indexOf(lap) + 1;
      const y = 236 + i * 21;
      const isBest = laps.length > 1 && lap.time === best;
      if (isBest) el('rect', { x: 364, y: y - 15, width: 272, height: 20, rx: 3, fill: '#6b21a8' }, rows);
      el('text', { x: 372, y, fill: isBest ? '#fff' : '#9ca3af' }, rows).textContent = 'L' + n;
      el('text', { x: 520, y, fill: '#fff', 'text-anchor': 'end' }, rows).textContent = format(lap.time);
      el('text', { x: 628, y, fill: '#6b7280', 'text-anchor': 'end', 'font-size': 11 }, rows).textContent = format(lap.total);
    });
  }

  function updateButtons() {
    $('startLabel').textContent = running ? 'STOP' : 'START';
    $('startCap').setAttribute('fill', running ? '#dc2626' : '#16a34a');
    $('startRing').setAttribute('fill', running ? '#ef4444' : '#22c55e');
    btnLap.classList.toggle('off', !running);
    btnReset.classList.toggle('off', running || currentTotal() === 0);
  }

  function tick() {
    render();
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    running = true;
    startTime = performance.now();
    updateButtons();
    tick();
  }

  function stop() {
    elapsed += performance.now() - startTime;
    running = false;
    cancelAnimationFrame(rafId);
    updateButtons();
    render();
  }

  function lap() {
    if (!running) return;
    const total = currentTotal();
    const time = total - lastLapTotal();
    const prevBest = bestLap();
    laps.push({ time, total });
    flashColor = prevBest === null || time < prevBest ? '#a855f7' : '#facc15';
    flashUntil = performance.now() + 900;
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0;
    laps = [];
    renderLaps();
    updateButtons();
    render();
  }

  function togglePage() {
    page = page === 'race' ? 'laps' : 'race';
    $('pageRace').style.display = page === 'race' ? '' : 'none';
    $('pageLaps').style.display = page === 'laps' ? '' : 'none';
    $('knobPointer').style.transform = page === 'race' ? 'rotate(-40deg)' : 'rotate(40deg)';
    $('lblRace').setAttribute('fill', page === 'race' ? '#facc15' : '#71717a');
    $('lblLaps').setAttribute('fill', page === 'laps' ? '#facc15' : '#71717a');
  }

  // 정지 상태에서도 깜빡임이 끝날 때까지 렌더
  function flashLoop() {
    if (!running) render();
    if (performance.now() < flashUntil) requestAnimationFrame(flashLoop);
  }

  btnStart.addEventListener('click', () => running ? stop() : start());
  btnLap.addEventListener('click', () => { lap(); flashLoop(); });
  btnReset.addEventListener('click', reset);
  $('knobPage').addEventListener('click', togglePage);

  const pressKeys = { Space: btnStart, KeyL: btnLap, KeyR: btnReset, KeyP: $('knobPage') };
  document.addEventListener('keydown', e => {
    const b = pressKeys[e.code];
    if (!b) return;
    e.preventDefault();
    if (e.repeat) return;
    b.classList.add('pressed');
    setTimeout(() => b.classList.remove('pressed'), 120);
    b.dispatchEvent(new MouseEvent('click'));
  });

  page = 'laps';
  togglePage();
  renderLaps();
  updateButtons();
  render();
</script>
</body>
</html>
